<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 64 64" role="img" aria-labelledby="title">
  <title id="title">Nexus</title>
  <!-- Background Badge -->
  <rect x="8" y="8" width="64" height="64" rx="16" fill="#12372A"/>

  <!-- Connecting Mesh (Brainstorming Links) -->
  <g stroke="#2A6049" stroke-width="2" stroke-linecap="round">
    <line x1="40" y1="20" x2="57" y2="30"/>
    <line x1="57" y1="30" x2="57" y2="50"/>
    <line x1="57" y1="50" x2="40" y2="60"/>
    <line x1="40" y1="60" x2="23" y2="50"/>
    <line x1="23" y1="50" x2="23" y2="30"/>
    <line x1="23" y1="30" x2="40" y2="20"/>
  </g>

  <!-- Active Convergence Lines to Center -->
  <g stroke="#4BB684" stroke-width="2.2" stroke-linecap="round">
    <line x1="40" y1="20" x2="40" y2="40"/>
    <line x1="57" y1="30" x2="40" y2="40"/>
    <line x1="57" y1="50" x2="40" y2="40"/>
    <line x1="40" y1="60" x2="40" y2="40"/>
    <line x1="23" y1="50" x2="40" y2="40"/>
    <line x1="23" y1="30" x2="40" y2="40"/>
  </g>

  <!-- Central Synthesis Hub -->
  <circle cx="40" cy="40" r="6" fill="#FFFFFF"/>

  <!-- 6 Agent Nodes -->
  <circle cx="40" cy="20" r="4" fill="#4BB684"/>
  <circle cx="57" cy="30" r="4" fill="#E8F5E9"/>
  <circle cx="57" cy="50" r="4" fill="#4BB684"/>
  <circle cx="40" cy="60" r="4" fill="#E8F5E9"/>
  <circle cx="23" cy="50" r="4" fill="#4BB684"/>
  <circle cx="23" cy="30" r="4" fill="#E8F5E9"/>
</svg>
