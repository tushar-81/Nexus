<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="100%" height="100%">
  <defs>
    <linearGradient id="nexusWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#072A1A" />
      <stop offset="35%" stop-color="#0C4A2E" />
      <stop offset="70%" stop-color="#147A4B" />
      <stop offset="100%" stop-color="#20B873" />
    </linearGradient>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#041E11" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- White Page Canvas -->
  <rect width="794" height="1123" fill="#FFFFFF" />

  <!-- Bottom Wavy Footer Ribbon -->
  <path d="M 0,1112
           C 45,1122 95,1090 155,1090
           C 215,1090 250,1116 305,1116
           C 360,1116 405,1090 465,1090
           C 525,1090 565,1116 620,1116
           C 675,1116 720,1090 770,1090
           C 782,1090 790,1093 794,1096
           L 794,1123 L 0,1123 Z"
        fill="url(#nexusWaveGrad)" />

  <!-- Bottom-Right Your Nexus Icon + Overlaid NEXUS Text -->
  <g transform="translate(678, 1015)" filter="url(#badgeShadow)">
    <!-- Your Rounded Square Dark Green Icon -->
    <rect x="8" y="8" width="64" height="64" rx="16" fill="#12372A"/>

    <!-- Connecting Hexagonal Mesh -->
    <g stroke="#2A6049" stroke-width="2" stroke-linecap="round">
      <line x1="40" y1="20" x2="57" y2="30"/>
      <line x1="57" y1="30" x2="57" y2="50"/>
      <line x1="57" y1="50" x2="40" y2="60"/>
      <line x1="40" y1="60" x2="23" y2="50"/>
      <line x1="23" y1="50" x2="23" y2="30"/>
      <line x1="23" y1="30" x2="40" y2="20"/>
    </g>

    <!-- Active Convergence Lines to Center -->
    <g stroke="#4BB684" stroke-width="2.2" stroke-linecap="round">
      <line x1="40" y1="20" x2="40" y2="40"/>
      <line x1="57" y1="30" x2="40" y2="40"/>
      <line x1="57" y1="50" x2="40" y2="40"/>
      <line x1="40" y1="60" x2="40" y2="40"/>
      <line x1="23" y1="50" x2="40" y2="40"/>
      <line x1="23" y1="30" x2="40" y2="40"/>
    </g>

    <!-- Central Hub & 6 Agent Nodes -->
    <circle cx="40" cy="40" r="6" fill="#FFFFFF"/>
    <circle cx="40" cy="20" r="4" fill="#4BB684"/>
    <circle cx="57" cy="30" r="4" fill="#E8F5E9"/>
    <circle cx="57" cy="50" r="4" fill="#4BB684"/>
    <circle cx="40" cy="60" r="4" fill="#E8F5E9"/>
    <circle cx="23" cy="50" r="4" fill="#4BB684"/>
    <circle cx="23" cy="30" r="4" fill="#E8F5E9"/>

    <!-- NEXUS Label Below/Overlapping Icon -->
    <text x="40" y="84"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="13"
          font-weight="900"
          text-anchor="middle"
          letter-spacing="2"
          fill="#12372A">NEXUS</text>
  </g>
</svg>
